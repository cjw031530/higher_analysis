defaults:
  - protocols: default
  - _self_
  - override hydra/job_logging: disabled

model:
  path: null # Required: path to v1_model.pkl or v2_model.pkl.
  settings_path: null
  history_path: null

data:
  path: null # Defaults to the source CSV recorded during training.
  chunk_rows: 20000

validation:
  protocol: native # native or v1; v2-on-v1 is supported.

output:
  base_dir: null # Defaults to a validation directory beside the model.

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

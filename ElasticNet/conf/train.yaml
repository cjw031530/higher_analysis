defaults:
  - protocols: default
  - _self_
  - override hydra/job_logging: disabled

data:
  path: kcb_202306_202405_undersampled_1to4.csv
  chunk_rows: 20000

output:
  base_dir: ElasticNet/outputs

model:
  solver: saga
  penalty: elasticnet
  l1_ratio: 0.5
  C: 0.1
  max_epochs: 200
  tol: 0.0001
  random_state: 42

runtime:
  models: [v1, v2]
  parallel_models: true
  training_threads: 0 # 0 uses one thread per selected protocol, up to available CPUs.
  live_plot: auto # auto, on, or off.
  plot_every: 5

checkpoint:
  every: 20 # Full optimizer snapshots every N completed epochs.
  resume_from: null # Set to a checkpoint directory to resume its protocol.

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
